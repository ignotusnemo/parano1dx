[package]
name = "parano1dx-vault-solana"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
custom-heap = []
default = ["custom-heap"]
wide-transport = []

[dependencies]
parano1dx-vault-auth = { path = "../auth" }
p3-field.workspace = true
p3-koala-bear.workspace = true
p3-uni-stark.workspace = true
postcard.workspace = true
solana-program = "2.3.0"
talc = { path = "../vendor/talc", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["max_level_off", "release_max_level_off"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
