<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Security model, proofs, exact parameter calculations and resource assessment for native-asset vault authorization.">
<title>Native-Asset Vault Authorization: Security Report</title>
<style>
:root{color-scheme:light;--ink:#142235;--muted:#475569;--rule:#c5ced8;--paper:#fff;--tint:#f2f5f8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,'Times New Roman',serif}main{max-width:910px;margin:0 auto;padding:44px 38px 70px}header{border-bottom:2px solid var(--ink);padding-bottom:24px;margin-bottom:28px}h1,h2,h3,h4,nav,button,table,.meta,.scope,.label{font-family:Arial,Helvetica,sans-serif}h1{font-size:34px;line-height:1.2;letter-spacing:-.7px;max-width:760px;margin:16px 0}h2{font-size:24px;line-height:1.3;margin:38px 0 14px;border-bottom:1px solid var(--rule);padding-bottom:9px}h3{font-size:18px;line-height:1.4;margin:26px 0 10px}p{margin:10px 0 14px}a{color:#164b83;text-underline-offset:3px}header a{font-size:14px}.meta{font-size:14px;color:var(--muted)}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase}nav{display:flex;gap:9px 20px;flex-wrap:wrap;font-size:14px;margin:22px 0 30px}nav a{white-space:nowrap}.scope{font-size:14px;line-height:1.55;border-left:3px solid var(--ink);padding:12px 17px;background:var(--tint);margin:18px 0 22px}.scope strong{display:block;font-size:15px;margin-bottom:5px}.theorem{border-left:2px solid #69819d;padding:0 0 0 17px;margin:24px 0}.proof-label{font-variant:small-caps;font-weight:bold}.equation{overflow-x:auto;padding:7px 2px;margin:17px 0}.equation .katex{font-size:1.02em}.equation .katex-display{margin:.4em 0}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.5;margin:18px 0 25px}th{text-align:left;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px 11px}td{padding:10px 11px;border-bottom:1px solid var(--rule);vertical-align:top}td:last-child{min-width:150px}tr:last-child td{border-bottom:1px solid var(--ink)}.number{font-variant-numeric:tabular-nums;white-space:nowrap}.small{font-size:14px;line-height:1.55;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.55 'Courier New',monospace;background:var(--tint);padding:13px 16px;margin:17px 0;tab-size:4}code{font: .9em 'Courier New',monospace}ul,ol{padding-left:24px}li{margin:6px 0}.proof-source{margin-top:25px}.appendix h3{font-size:17px}.appendix p{margin:9px 0 12px;overflow-wrap:anywhere}.appendix .subheading{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;margin-top:22px}.references{font-size:14px;overflow-wrap:anywhere}button{border:1px solid var(--ink);color:var(--ink);background:white;border-radius:0;padding:8px 13px;cursor:pointer;font-size:13px}.footer{margin-top:45px;padding-top:18px;border-top:1px solid var(--rule)}.verdict{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;padding:15px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
@media(max-width:600px){main{padding:24px 20px 44px}h1{font-size:28px}h2{font-size:21px}body{font-size:16px}table{font-size:12px}td,th{padding:8px 6px}td:last-child{min-width:90px}.topline{align-items:flex-start}.topline a{font-size:12px}.equation .katex{font-size:.84em}}
@page{size:A4;margin:18mm 19mm 19mm;@bottom-center{content:counter(page);font:8pt Arial,Helvetica,sans-serif;color:#475569}} @media print{body{font-size:10.4pt;line-height:1.43;color:#111}main{max-width:none;margin:0;padding:0}h1{font-size:25pt}h2{font-size:16pt;margin:23pt 0 10pt}h3{font-size:12pt;margin:17pt 0 8pt}h4{font-size:10.6pt}header{padding-bottom:13pt;margin-bottom:18pt}.meta,.small{font-size:9pt}.scope{font-size:9pt;padding:8pt 11pt;margin:12pt 0}nav,.screen-only{display:none!important}table{font-size:8.7pt;line-height:1.4}td,th{padding:6pt 7pt}thead{display:table-header-group}tr{break-inside:avoid}h1,h2,h3,h4,.subheading{break-after:avoid}p{orphans:3;widows:3}.theorem{margin:15pt 0}.equation{overflow:visible;break-inside:avoid;margin:11pt 0}.equation .katex{font-size:.94em}pre{font-size:8.1pt;line-height:1.35;padding:8pt 10pt}a{color:inherit;text-decoration:none}.verdict{font-size:9.6pt}.appendix h3{font-size:11pt}.references{font-size:8.6pt}.footer{font-size:9pt}.proof-source{margin-top:20pt}}
</style>
